<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post-Prohibition: Research, Pedagogy, Action</title>
<meta name="description" content="An academic research network.">
<meta property="og:title" content="Post-Prohibition: Research, Pedagogy, Action">
<meta property="og:type" content="website">
<meta property="og:image" content="images/Post-Prohibition.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFBF9;
    --ink:#15130F;
    --muted:#6E6A62;
    --rule:#DCD8D0;
    --gap:clamp(4rem,9vw,9rem);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Spectral",Georgia,serif;font-weight:300;
    font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  :focus-visible{outline:1px solid var(--ink);outline-offset:4px}
  .skip{position:absolute;left:-9999px}
  .skip:focus{position:fixed;left:1rem;top:1rem;background:var(--bg);padding:.6rem 1rem;z-index:50}

  /* Header — name left, sections right, one hairline beneath */
  header{
    position:sticky;top:0;z-index:10;background:var(--bg);
    border-bottom:1px solid var(--rule);
  }
  .bar{
    display:flex;align-items:baseline;justify-content:space-between;gap:2rem;
    width:min(1500px,94vw);margin-inline:auto;padding:1.4rem 0;
  }
  .name{font-size:1.25rem;letter-spacing:.01em;text-decoration:none}
  nav ul{display:flex;gap:2rem;list-style:none;margin:0;padding:0;font-size:.95rem}
  nav a{text-decoration:none;color:var(--muted)}
  nav a:hover,nav a[aria-current="page"]{color:var(--ink)}
  @media (max-width:560px){
    .bar{flex-direction:column;align-items:flex-start;gap:.8rem}
    nav ul{gap:1.4rem}
  }

  main{width:min(1500px,94vw);margin-inline:auto;padding:var(--gap) 0 calc(var(--gap) * 1.2)}
  figure{margin:0 0 var(--gap);display:flex;flex-direction:column;align-items:center}
  figure:last-child{margin-bottom:0}

  /* Fixed 200 x 200 logo. The CSS — not the width/height attributes —
     is what decides the rendered size. */
  figure img{
    display:block;
    width:200px;
    height:200px;
    object-fit:contain;   /* swap to "cover" if you want it cropped to fill */
    background:#EFEDE8;
  }

  figcaption{
    margin-top:.9rem;font-size:.875rem;color:var(--muted);
    text-align:center;max-width:46ch;
  }
  figcaption em{font-style:italic;color:var(--ink)}

  footer{
    border-top:1px solid var(--rule);
    width:min(1500px,94vw);margin-inline:auto;
    padding:1.6rem 0 3rem;font-size:.875rem;color:var(--muted);
    display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:space-between;
  }
  footer a{text-decoration:none}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<a class="skip" href="#primary">Skip to content</a>

<header>
  <div class="bar">
    <a class="name" href="/">Post-Prohibition: Research, Pedagogy, Action</a>
    <nav aria-label="Main">
      <ul>
        <li><a href="/selected-works/" aria-current="page">Info</a></li>
        <li><a href="/archive/">Annotated Bibliography</a></li>
        <li><a href="/information/">Convenors</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="primary">
  <figure>
    <img src="images/Post-Prohibition.png"
         width="740" height="740"
         alt="Post-Prohibition network logo">
    <figcaption>Post-Prohibition: Research, Pedagogy, Action is an academic research network.</figcaption>
  </figure>
</main>

<footer>
  <span>© 2026</span>
  <span><a href="mailto:email@example.com">email@example.com</a> · <a href="https://instagram.com/">Instagram</a></span>
</footer>

</body>
</html>
